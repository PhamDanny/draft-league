name: Update stats and publish

# Runs whenever replays.txt (or the config, parser or page) changes. Add a replay link to
# replays.txt on github.com and the site updates itself a minute or two later.
on:
  push:
    branches: [main]
    paths:
      - replays.txt
      - config/**
      - scripts/**
      - index.html
      - dash-shim.js
      - sprites*.js
      - .github/workflows/update.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data from replays.txt
        run: python3 scripts/build.py
      - name: Save rebuilt data and replay cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cache
          if ! git diff --cached --quiet; then
            git commit -m "Update stats from replays"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html dash-shim.js sprites1.js sprites2.js _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
